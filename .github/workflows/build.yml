name: Build ClipSync AI EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python numpy librosa

    - name: Build Single EXE File
      run: |
        pyinstaller --noconsole --onefile main.py

    - name: Upload EXE Output
      uses: actions/upload-artifact@v3
      with:
        name: ClipSync-AI-App
        path: dist/*.exe
